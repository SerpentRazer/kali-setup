font_family GeistMono Nerd Font
font_size 10
confirm_os_window_close 0

shell_integration enabled

# Kali: scos `linux_display_server x11` din upstream (ocolis pt Intel Ivy Bridge) - aici kitty ruleaza nativ Wayland.

include matugen.conf

cursor_shape beam
cursor_blink_interval 0.5

# --- translucent background so the wallpaper blurs through (Hyprland does the blur) ---
background_opacity 0.80
dynamic_background_opacity yes

# --- spatiere interioara (text sa nu stea lipit de margini) ---
window_padding_width 12
