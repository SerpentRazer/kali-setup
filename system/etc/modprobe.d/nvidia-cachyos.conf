# Din CachyOS-Settings (usr/lib/modprobe.d/nvidia.conf): driverul nu mai goleste memoria sistem inainte s-o dea GPU-ului.
# Alocari mai rapide; pretul = un proces ar putea vedea resturi din memoria eliberata de altul (laptop cu un singur user).
options nvidia NVreg_InitializeSystemMemoryAllocations=0
