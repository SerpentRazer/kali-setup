# Din CachyOS-Settings (70-cachyos-settings.conf) si Bazzite (60-kernel, 65-memory, 80-inotify), 30 oct 2026.
# swappiness=100 (era 150 pana la 1 nov 2026) vine din /etc/udev/rules.d/30-zram.rules, doar cand zram e activ.

# Pastreaza mai mult cache de directoare/inode-uri (CachyOS).
vm.vfs_cache_pressure = 50
# Scrieri pe disc in bucati mici si dese in loc de ~3 GB odata (20% din RAM) -> fara blocaje la
# descarcari Steam/copieri mari (CachyOS + Bazzite).
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
# Din zram se citeste cate o pagina, nu cate 8 (CachyOS + Bazzite).
vm.page-cluster = 0
# kswapd elibereaza memorie mai devreme si fara rafale -> mai putine opriri in jocuri (Bazzite).
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
# Fara incetinirea artificiala a proceselor care fac split lock (jocuri Windows prin Proton) (ambele).
kernel.split_lock_mitigate = 0
# Fara NMI watchdog: un contor de performanta liber si mai putine intreruperi (ambele).
kernel.nmi_watchdog = 0
# Toate combinatiile Alt+SysRq, inclusiv REISUB si F (OOM killer) cand se blocheaza grafica (CachyOS).
kernel.sysrq = 1
# 128 era prea putin pt Electron/VS Code/Dolphin (Bazzite).
fs.inotify.max_user_instances = 8192
fs.inotify.max_user_watches = 524288
